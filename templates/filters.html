<form class="filters" method="get" aria-label="Report filters">
  <label>Internship batch<select name="cohort"><option value="">All batches</option>{% for choice in cohorts %}<option value="{{ choice.pk }}" {% if request.GET.cohort == choice.pk|stringformat:"s" %}selected{% endif %}>{{ choice }}</option>{% endfor %}</select></label>
  <label>Domain<select name="domain"><option value="">All domains</option>{% for choice in domains %}<option value="{{ choice.pk }}" {% if request.GET.domain == choice.pk|stringformat:"s" %}selected{% endif %}>{{ choice }}</option>{% endfor %}</select></label>
  <label>Team<select name="team"><option value="">All teams</option>{% for choice in teams %}<option value="{{ choice.pk }}" {% if request.GET.team == choice.pk|stringformat:"s" %}selected{% endif %}>{{ choice }}</option>{% endfor %}</select></label>
  <button class="button secondary" type="submit">Apply filters</button>
  {% if request.GET %}<a class="text-link" href="{{ request.path }}">Clear</a>{% endif %}
</form>
