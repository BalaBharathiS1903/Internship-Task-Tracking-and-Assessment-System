<section class="stat-grid" aria-label="Assignment totals">
  <article class="stat"><span class="chip teal" aria-hidden="true">☷</span><p>Assignments</p><strong>{{ counts.total }}</strong></article>
  <article class="stat"><span class="chip green" aria-hidden="true">✓</span><p>Completed</p><strong>{{ counts.complete }}</strong></article>
  <article class="stat"><span class="chip blue" aria-hidden="true">◷</span><p>Pending</p><strong>{{ counts.pending }}</strong></article>
  <article class="stat"><span class="chip orange" aria-hidden="true">!</span><p>Overdue</p><strong>{{ counts.overdue }}</strong></article>
</section>
