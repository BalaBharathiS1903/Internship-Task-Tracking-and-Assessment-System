{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  <span>Showing {{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span>
  <div class="actions">
    {% if page.has_previous %}<a class="button small secondary" href="{% querystring page=page.previous_page_number %}">Previous</a>{% endif %}
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="button small secondary" href="{% querystring page=page.next_page_number %}">Next</a>{% endif %}
  </div>
</nav>
{% endif %}
